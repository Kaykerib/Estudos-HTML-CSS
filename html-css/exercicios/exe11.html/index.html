<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midias em HTML5</title>
</head>
<body>
    <h1>Imagens dinâmica</h1>
<p>Tente abrir esse site em varios dispositivos diferentes simplesmente aumente e diminua o tamanho do seu navegador</p>
    <picture>
        <source media="(max-width: 750px)" srcset="imagens/fotoP.png" type="image/png">
        <source media="(max-width: 1050px)" srcset="imagens/fotoM.png" type="image/png">
        <img src="imagens/Foto G.png" alt="imagens flexivel">
    </picture>
    <h1> Reproduzindo </h1>
    <p> Vamos aprender a reproduzir áudios en HTML</p>
    <audio preload="metadata" autoplay controls
    loop>
        <source srcset="guanacast-33.mp3" type="audio/mpeg">
        <source srcset="happy-mistake.mp3" type="audio/ogg">
        <source srcset="happy-mistake.wav" type="audio/wav">
        <p>Navegador não carrega
        <a href="guanacast-33.mp3">Para fazer o downloand</a>
        </p>

</body>
</html>
